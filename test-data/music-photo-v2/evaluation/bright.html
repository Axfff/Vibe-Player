<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bright provisional labels</title><style>body{font:16px/1.5 system-ui,sans-serif;background:#f4f3ef;color:#212b2c;margin:0;padding:32px}main{max-width:1400px;margin:auto}h1{font-size:30px;margin:0 0 12px}.notice{padding:16px;background:#fff1d3;border-left:4px solid #b08036;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}figure{margin:0;background:white;padding:12px;border:1px solid #dce1df;border-radius:8px}img{display:block;width:100%;height:240px;object-fit:contain;background:#eceeea}figcaption{padding-top:10px}.id{font-family:monospace;font-weight:bold}a{color:#216052}small{display:block;color:#555}table{border-collapse:collapse;width:100%;background:white}td,th{padding:12px;border:1px solid #dce1df;text-align:left}.badge{background:#edf3ed;padding:3px 8px;border-radius:4px}footer{margin-top:32px;color:#555}</style><main><h1>bright · 初始评价标签</h1><div class="notice">全部标签均为 agent 初选的 provisional 标签。未经过真人试听或审核，不是 ground truth。此目录、答案页和来源描述不得输入推荐器。</div><p><a href="../galleries/bright.html">盲版</a> · <a href="expected-relevance.csv">完整标注 CSV</a></p><div class="grid"><figure><a href="../media/images/img_0025.jpg"><img loading="lazy" src="../media/images/img_0025.jpg" alt="img_0025"></a><figcaption><span class="id">img_0025</span> · <a href="https://commons.wikimedia.org/wiki/File:Waves_crashing_up_through_the_boardwalk_in_Lysekil_during_Storm_Ciara_1.jpg">Source / 来源</a><p><span class="badge">mismatch · 0/3</span></p><p>浪打栈道的冲击与危险感过强。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0010.jpg"><img loading="lazy" src="../media/images/img_0010.jpg" alt="img_0010"></a><figcaption><span class="id">img_0010</span> · <a href="https://commons.wikimedia.org/wiki/File:Peaceful_Forest_Path.jpg">Source / 来源</a><p><span class="badge">acceptable_match · 2/3</span></p><p>林径有柔和日光与生命感，能够做轻松封面，但活动感较弱。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0033.jpg"><img loading="lazy" src="../media/images/img_0033.jpg" alt="img_0033"></a><figcaption><span class="id">img_0033</span> · <a href="https://commons.wikimedia.org/wiki/File:Nopple_sky_1.jpg">Source / 来源</a><p><span class="badge">strong_match · 3/3</span></p><p>多只风筝悬在开阔天空，漂浮活动与留白带来轻盈感。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0026.jpg"><img loading="lazy" src="../media/images/img_0026.jpg" alt="img_0026"></a><figcaption><span class="id">img_0026</span> · <a href="https://commons.wikimedia.org/wiki/File:Chutes_d%27Ekom_from_the_platform_above_the_waterfall.jpg">Source / 来源</a><p><span class="badge">mismatch · 0/3</span></p><p>急流的压迫与混浊水体不适合轻松俏皮代表曲。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0028.jpg"><img loading="lazy" src="../media/images/img_0028.jpg" alt="img_0028"></a><figcaption><span class="id">img_0028</span> · <a href="https://commons.wikimedia.org/wiki/File:IncendioCa%C3%B1as.JPG">Source / 来源</a><p><span class="badge">hard_distractor · 0/3</span></p><p>同样是蓝天、暖色户外和道路，焦黑火后地面及空旷状态与轻快生机相反。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0004.jpg"><img loading="lazy" src="../media/images/img_0004.jpg" alt="img_0004"></a><figcaption><span class="id">img_0004</span> · <a href="https://commons.wikimedia.org/wiki/File:Anas_Platyrhynchos_Maikkulanpuisto_Oulu_20240613.jpg">Source / 来源</a><p><span class="badge">strong_match · 3/3</span></p><p>鸭妈妈与幼鸭游动，生命与轻松日常活动契合俏皮音乐。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0009.jpg"><img loading="lazy" src="../media/images/img_0009.jpg" alt="img_0009"></a><figcaption><span class="id">img_0009</span> · <a href="https://commons.wikimedia.org/wiki/File:Lake_with_Calm_Reflection_and_Cloudy_Sky.jpg">Source / 来源</a><p><span class="badge">acceptable_match · 2/3</span></p><p>户外自然与水面可承接轻松音乐；阴云与静止倒影使它弱于明显匹配，但仍可接受。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0035.jpg"><img loading="lazy" src="../media/images/img_0035.jpg" alt="img_0035"></a><figcaption><span class="id">img_0035</span> · <a href="https://commons.wikimedia.org/wiki/File:Raindrops_on_a_window_in_Brastad_2.jpg">Source / 来源</a><p><span class="badge">hard_distractor · 1/3</span></p><p>闪亮的小水滴与花朵高光在视觉上相近，但雨窗的隔离感不如欢快户外适合。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0037.jpg"><img loading="lazy" src="../media/images/img_0037.jpg" alt="img_0037"></a><figcaption><span class="id">img_0037</span> · <a href="https://commons.wikimedia.org/wiki/File:Bare_tree_in_Kent,_WA_(2025)_-_0010.jpg">Source / 来源</a><p><span class="badge">hard_distractor · 1/3</span></p><p>蓝天与细线条像风筝画面，裸枝静止、缺少活动与繁盛感。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0015.jpg"><img loading="lazy" src="../media/images/img_0015.jpg" alt="img_0015"></a><figcaption><span class="id">img_0015</span> · <a href="https://commons.wikimedia.org/wiki/File:Ruby_Mountain_refected_in_Diablo_Lake.jpg">Source / 来源</a><p><span class="badge">acceptable_match · 2/3</span></p><p>晴天山湖可传达积极开阔感，低动作强度使匹配弱于明显匹配组。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0005.jpg"><img loading="lazy" src="../media/images/img_0005.jpg" alt="img_0005"></a><figcaption><span class="id">img_0005</span> · <a href="https://commons.wikimedia.org/wiki/File:Butterfly%27s.jpg">Source / 来源</a><p><span class="badge">strong_match · 3/3</span></p><p>蝴蝶停在黄花上，自然生机与轻微活动感契合明亮组。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0002.jpg"><img loading="lazy" src="../media/images/img_0002.jpg" alt="img_0002"></a><figcaption><span class="id">img_0002</span> · <a href="https://commons.wikimedia.org/wiki/File:Meadow_saffron_near_Aar_spring,_Neuhof.jpg">Source / 来源</a><p><span class="badge">strong_match · 3/3</span></p><p>春季小花在草地开放，轻巧细节适合轻快音色。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0011.jpg"><img loading="lazy" src="../media/images/img_0011.jpg" alt="img_0011"></a><figcaption><span class="id">img_0011</span> · <a href="https://commons.wikimedia.org/wiki/File:2007.09_-_%27Low_view_in_southern_direction_on_the_cliff_walls%27,_and_the_rocky_beach_near_Petit-Dalle_in_Normandy_France_with_a_quiet_sea;_French_landscape_photography,_Fons_Heijnsbroek_(10543193593).jpg">Source / 来源</a><p><span class="badge">acceptable_match · 2/3</span></p><p>晴朗海岸适合休闲气氛，不过构图较静态。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0007.jpg"><img loading="lazy" src="../media/images/img_0007.jpg" alt="img_0007"></a><figcaption><span class="id">img_0007</span> · <a href="https://commons.wikimedia.org/wiki/File:On_the_Beach_at_Waikiki_(10958004634).jpg">Source / 来源</a><p><span class="badge">strong_match · 3/3</span></p><p>海滩上的多彩冲浪板暗示轻松户外娱乐；不是竞技紧张场景。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0006.jpg"><img loading="lazy" src="../media/images/img_0006.jpg" alt="img_0006"></a><figcaption><span class="id">img_0006</span> · <a href="https://commons.wikimedia.org/wiki/File:Pink_and_white_Nymphaea_water_lily_flowers,_%D0%B1%D0%B5%D0%BB_%D0%B8_%D1%80%D0%BE%D0%B7%D0%BE%D0%B2_%D0%BB%D0%BE%D1%82%D0%BE%D1%81.jpg">Source / 来源</a><p><span class="badge">strong_match · 3/3</span></p><p>粉白睡莲盛开，多个花朵的节律与活力契合积极气氛。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0023.jpg"><img loading="lazy" src="../media/images/img_0023.jpg" alt="img_0023"></a><figcaption><span class="id">img_0023</span> · <a href="https://commons.wikimedia.org/wiki/File:Freestanding_facade_of_a_ruined_colonial_building_in_Porlamar,_Margarita_Island,_Venezuela.jpg">Source / 来源</a><p><span class="badge">hard_distractor · 1/3</span></p><p>蓝天和明亮建筑表面像愉快旅行照，残破立面与空街却偏失落。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0040.jpg"><img loading="lazy" src="../media/images/img_0040.jpg" alt="img_0040"></a><figcaption><span class="id">img_0040</span> · <a href="https://commons.wikimedia.org/wiki/File:Mayon_Volcano_Eruption_at_Night.jpg">Source / 来源</a><p><span class="badge">mismatch · 0/3</span></p><p>夜间喷发的威胁感与积极轻盈气氛明显不同。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0008.jpg"><img loading="lazy" src="../media/images/img_0008.jpg" alt="img_0008"></a><figcaption><span class="id">img_0008</span> · <a href="https://commons.wikimedia.org/wiki/File:Rainbow-6.22.26.jpg">Source / 来源</a><p><span class="badge">strong_match · 3/3</span></p><p>雨后城市天空出现彩虹，开放天空与转晴意味提供希望感。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0001.jpg"><img loading="lazy" src="../media/images/img_0001.jpg" alt="img_0001"></a><figcaption><span class="id">img_0001</span> · <a href="https://commons.wikimedia.org/wiki/File:Son%C4%8Dnica_-_Sunflower_-_Helianthus_annuus_(1).JPG">Source / 来源</a><p><span class="badge">strong_match · 3/3</span></p><p>向日葵朝向开阔蓝天，植物生长与仰视构图呈现积极感。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure><figure><a href="../media/images/img_0027.jpg"><img loading="lazy" src="../media/images/img_0027.jpg" alt="img_0027"></a><figcaption><span class="id">img_0027</span> · <a href="https://commons.wikimedia.org/wiki/File:Thunderstorm_(lightning).jpg">Source / 来源</a><p><span class="badge">mismatch · 0/3</span></p><p>强雷暴的紧张情境与轻快音乐不一致。</p><small>provisional · agent_visual_inspection + audio_author_description/source_tags; no human listening</small></figcaption></figure></div></main></html>
