name: Android CI

on:
  push:
    branches: [main, 'feat/**', 'ci/coverage-probe/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COVERAGE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            project/**/*.gradle
            project/gradle.properties
            project/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify scope and gate contract
        run: |
          python scripts/test_coverage_contract.py
          python scripts/coverage/coverage.py scope
          cd project
          bash ./gradlew --no-daemon --console=plain clean
          cd ..
          python scripts/coverage/coverage.py start
      - name: JVM tests and debug APK
        working-directory: project
        run: bash ./gradlew --no-daemon --console=plain --continue :app:testDebugUnitTest :app:assembleDebug
      - name: Enable KVM for disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android runtime and playback regressions
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        env:
          ANDROID_SERIAL: emulator-5554
          DISPOSABLE_EMULATOR: '1'
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: sprint3-disposable
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio -camera-back none
          script: |
            python scripts/require-disposable-emulator.py
            cd project && bash ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest
      - name: Test existing Discovery backend when present
        if: ${{ !cancelled() && hashFiles('services/discovery/discovery/**/*.py') != '' }}
        working-directory: services/discovery
        run: |
          python -m pip install -r requirements.txt pytest-cov==7.1.0 coverage==7.17.0
          python -m pytest --cov=discovery --cov-report=xml:../../artifacts/coverage/backend.xml --cov-report=html:../../artifacts/coverage/backend --junitxml=../../artifacts/coverage/backend-junit.xml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ !cancelled() && hashFiles('services/discovery/static/*.js', 'services/discovery/static/*.mjs') != '' }}
        with:
          node-version: '24'
      - name: Test all Discovery web production files when present
        if: ${{ !cancelled() && hashFiles('services/discovery/static/*.js', 'services/discovery/static/*.mjs') != '' }}
        working-directory: services/discovery
        run: |
          npm install -g pnpm@11.25.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run test:coverage
      - name: Generate full Android HTML and XML from collected data
        if: ${{ !cancelled() }}
        working-directory: project
        run: bash ./gradlew --no-daemon --console=plain :app:teamCoverageReport
      - name: Controlled failure probe - zero line hits (NEVER MERGE)
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          path = 'project/app/build/reports/coverage/android.xml'
          tree = ET.parse(path)
          for line in tree.getroot().iter('line'):
              line.set('mi', str(int(line.get('mi')) + int(line.get('ci'))))
              line.set('ci', '0')
          tree.write(path)
          PY
      - name: Enforce complete reports, executed tests and exact 80 percent line gate
        if: ${{ !cancelled() }}
        run: python scripts/coverage/coverage.py report
      - name: Upload full reports and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: team-coverage-${{ github.run_id }}
          path: |
            artifacts/coverage/
            docs/testing/coverage-scope.json
            project/app/build/reports/
            project/app/build/test-results/
            project/app/build/outputs/androidTest-results/
            project/app/build/outputs/unit_test_code_coverage/
            project/app/build/outputs/code_coverage/
          if-no-files-found: error
          retention-days: 90
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-debug-${{ github.run_id }}
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      actions: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/coverage-publish.yml
    with:
      run_id: ${{ fromJSON(github.run_id) }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      pr_number: ${{ github.event.pull_request.number }}
      build_result: ${{ needs.build.result }}
