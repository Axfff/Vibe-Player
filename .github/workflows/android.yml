name: Android CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            project/**/*.gradle
            project/gradle.properties
            project/gradle/wrapper/gradle-wrapper.properties
      - name: Run unit tests and build debug APK
        run: bash ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-results
          path: |
            project/app/build/reports/tests/testDebugUnitTest/
            project/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
