name: Bug Report
description: Report a reproducible problem with Vibe-Player.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps and any setup needed to reproduce the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Actual behavior
      description: What happened after following those steps?
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Vibe-Player build
      description: Which Vibe-Player release tag, commit, or CI run/artifact did you install? If unknown, say so and tell us where you got the APK.
      placeholder: Release tag, commit SHA, or CI run/artifact link; app version if known.
    validations:
      required: true
  - type: textarea
    id: device-android-version
    attributes:
      label: Device and Android version
      description: Include the device model (or emulator) and Android version/API level.
      placeholder: Pixel 6 / Android 13 (API 33)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output.
      render: shell
  - type: textarea
    id: more-info
    attributes:
      label: More info
      description: Add more info to the bug report
      placeholder: For example, attach a screenshot or a screen recording
