apply plugin: 'com.android.application'

def fixtureDir = providers.gradleProperty('fixtureDir').orNull
def onnxAar = providers.gradleProperty('onnxAar').orNull
if (!fixtureDir || !onnxAar) {
    throw new GradleException('Provide -PfixtureDir=<absolute path> and -PonnxAar=<absolute path>')
}

android {
    namespace 'org.vibe.onnxcheck'
    compileSdk 33
    defaultConfig {
        applicationId 'org.vibe.onnxcheck'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets { main { assets.srcDirs = [fixtureDir] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation files(onnxAar) }
